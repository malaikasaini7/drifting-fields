<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>drifting fields - a WebGL gradient playground</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="stage" aria-hidden="true"></canvas>

  <header class="title">
    <h1>drifting fields</h1>
    <p>a domain-warped simplex field on raw WebGL2 - no libraries</p>
  </header>

  <aside class="panel">
    <div class="row swatches" id="swatches" role="radiogroup" aria-label="palette"></div>
    <label class="row slider">
      <span>grain</span>
      <input id="grain" type="range" min="0" max="0.08" step="0.002" value="0.022">
    </label>
    <label class="row slider">
      <span>glow height</span>
      <input id="glow" type="range" min="0.05" max="0.95" step="0.01" value="0.18">
    </label>
  </aside>

  <script src="field.js"></script>
  <script src="app.js"></script>
</body>
</html>
